[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heimdall"
version = "1.0.0"
description = "Host Environment Intelligence for Monitoring, Diagnostics and Anomaly Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "rich>=13.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.scripts]
heimdall = "heimdall.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["heimdall*"]
